<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f6f5;--panel:#fff;--ink:#14201c;--muted:#5d6c67;--faint:#8a9893;--line:#e1e7e4;--line2:#eef2f0;
--accent:#1d6b57;--accent-2:#258a71;--accent-soft:#e4f1ec;--red:#c0362c;--red-soft:#fcebe9;--amber:#a6600a;--amber-soft:#fdf2e2;
--blue:#2f5aa8;--blue-soft:#e9effa;--shadow:0 1px 2px rgba(16,24,20,.05),0 2px 8px rgba(16,24,20,.04);--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--panel:#151f1c;--ink:#e3ebe8;--muted:#9fb1ab;--faint:#74857f;--line:#26332f;--line2:#1d2926;
--accent:#56c0a0;--accent-2:#6fd0b2;--accent-soft:#16302a;--red:#ff8b80;--red-soft:#3a1c1a;--amber:#f0ae5c;--amber-soft:#33260f;--blue:#9cb8f0;--blue-soft:#1c2740;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
@media (max-width:1180px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static!important;height:auto!important;flex-direction:row!important;flex-wrap:wrap;gap:4px!important}.side .foot{display:none!important}}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;padding:4px 8px 14px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:.95rem}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--line2);color:var(--ink)}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fb67c;margin-right:6px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}

.sub{color:var(--muted);margin:4px 0 0;max-width:720px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--faint)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.p-read{background:var(--line2);color:var(--muted)} .p-edit{background:var(--amber-soft);color:var(--amber)} .p-sent{background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.kpi{padding:14px 16px}.kpi .l{font-size:.78rem;color:var(--muted);font-weight:500}.kpi .v{font-size:1.5rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.78rem;color:var(--faint)} .up{color:var(--accent)} .down{color:var(--red)}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:1rem;margin:0}.sec-h .why{color:var(--muted);font-size:.85rem}
.sec-h .count{margin-left:auto;color:var(--muted);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-soft);color:var(--red)} .t-amber{background:var(--amber-soft);color:var(--amber)} .t-blue{background:var(--blue-soft);color:var(--blue)}
.t-green{background:var(--accent-soft);color:var(--accent)} .t-grey{background:var(--line2);color:var(--muted)}
table{width:100%;border-collapse:collapse}
.card.sec,.card{overflow-x:auto}
td .pn{min-width:150px}
@media (max-width:1180px){.side{padding:10px 14px!important;align-items:center}.side .logo{margin:0 12px 0 0!important;padding:4px 8px!important}.side{border-right:0!important;border-bottom:1px solid var(--line)}.side .nav{width:auto!important;padding:8px 12px!important}}
@media (max-width:760px){th,td{padding:8px 6px!important}.sec-h{flex-wrap:wrap}.sec-h .why{flex-basis:100%}}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}

tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

a{color:var(--accent)}

.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.step button{border:0;background:var(--line2);width:30px;height:32px;cursor:pointer;font-weight:700}
.step input{width:62px;border:0;text-align:center;height:32px;font-weight:700;background:transparent}
.warn{color:var(--red);font-size:.75rem;font-weight:600;margin-top:4px}

select.sel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);max-width:230px}
.x{border:0;background:transparent;cursor:pointer;color:var(--faint);font-size:1.1rem}

.collapse{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.search{position:relative;padding:12px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.results{position:absolute;left:16px;right:16px;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;max-height:330px;overflow:auto}
.res{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.res:hover{background:var(--accent-soft)}
.empty{padding:18px 16px;color:var(--muted)}
.banner{padding:12px 16px;border-radius:12px;margin:10px 0;display:flex;gap:10px;align-items:center}
.b-edit{background:var(--amber-soft);color:var(--amber)} .b-sent{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.84rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.filters input{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:220px}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;width:110px}
.bar i{display:block;height:100%;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{padding:14px 16px}
.chart h3{margin:0;font-size:.95rem}.chart .big{font-size:1.25rem;font-weight:700}
svg text{fill:var(--faint);font-size:10px;font-family:var(--font)}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--panel);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header h3{margin:0;font-size:1.05rem}
.modal .body{padding:16px 18px;display:grid;gap:12px}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.mail{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);font-size:.88rem}
.mail h4{margin:10px 0 4px;font-size:.9rem}
.form{display:grid;gap:14px}
.fs{padding:16px}
.fs h3{margin:0 0 10px;font-size:.95rem}
.fg{display:grid;grid-template-columns:240px 1fr;gap:10px 16px;align-items:center}
@media (max-width:700px){.fg{grid-template-columns:1fr}}
.fg label{color:var(--muted);font-size:.88rem}
.fg input,.fg select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);max-width:340px}
.hint{font-size:.78rem;color:var(--faint);grid-column:2}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hide{display:none!important}
.ok{color:var(--accent);font-weight:700}.ko{color:var(--red);font-weight:700}
.note{font-size:.8rem;color:var(--faint);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}.nowrap{white-space:nowrap}

.k6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent)}
.acc{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.acc-red{border-left:5px solid var(--red)}.acc-blue{border-left:5px solid var(--blue)}.acc-grey{border-left:5px solid var(--line)}
.acc-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.acc-h:hover{background:var(--line2)}
.acc-h .att{display:grid;gap:2px;flex:1}.acc-h .att b{font-size:1rem}
.acc-h .asum{color:var(--ink);font-weight:600;font-size:.9rem;white-space:nowrap}
.aic{font-size:1.2rem}.chev{color:var(--muted);width:14px;display:inline-block}
.acc-b{border-top:1px solid var(--line)}
.ln{border-bottom:1px solid var(--line2)}.ln:last-child{border-bottom:0}.ln.off .lp,.ln.off .lk{opacity:.75}
.lh{display:grid;grid-template-columns:18px minmax(180px,2.2fr) minmax(150px,1.2fr) 110px 150px 80px 130px;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.lh:hover{background:var(--line2)}.ln.open .lh{background:var(--accent-soft)}
.lh .num{text-align:right}.la{text-align:right}
@media (max-width:900px){.lh{grid-template-columns:18px 1fr auto;}.lh .ls,.lh .lk,.lh .lv{display:none}}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:4px 16px 16px 44px;background:var(--accent-soft)}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem}
.dbox .dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:6px}
.dbox p{margin:0 0 5px}
svg .tl{font-size:10.5px;fill:var(--muted)} svg .tv{font-size:15px;font-weight:700}
.filters input.bigsearch{min-width:340px;padding:10px 12px;font-size:.95rem}
</style></head><body>
<div class="app">
<aside class="side">
  <div class="logo"><i>H</i>Hygisense</div>
  <button class="nav" data-v="tableau" aria-current="page">📊 Tableau de bord</button>
  <button class="nav" data-v="commande">🧾 Commande du jour <span class="n" id="nAnt"></span></button>
  <button class="nav" data-v="rapports">📈 Rapports</button>
  <button class="nav" data-v="parametres">⚙️ Paramètres</button>
  <button class="nav" data-v="methode">🔬 Méthode</button>
  <div class="foot">
    <div><b id="phName"></b></div>
    <div><span class="dot"></span>Logiciel de la pharmacie : synchro à <span id="fSync"></span></div>
    <div><span class="dot"></span>ANSM, FDA, Sentinelles : 2×/jour</div>
    <div>Démo : vraies données ANSM, FDA, Sentinelles · stock et ventes simulés</div>
  </div>
</aside>
<main>
<section id="v-tableau"></section>
<section id="v-commande" class="hide"></section>
<section id="v-rapports" class="hide"></section>
<section id="v-parametres" class="hide"></section>
<section id="v-methode" class="hide"></section>
</main>
</div>
<div id="modal"></div>
<div id="toast" class="toast hide"></div>
<script>
const D=/*DATA*/null, R=D.R;
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=x=>x==null?"–":Number(x).toLocaleString("fr-FR",{maximumFractionDigits:0});
const n1=x=>x==null?"–":Number(x).toLocaleString("fr-FR",{maximumFractionDigits:1});
const eur=x=>x==null?"–":Number(x).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const pc=x=>Math.round(x*100)+" %";
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),3200)}
// ---------- settings
const DEF={pharmacy:D.pharmacy,email:"titulaire@pharmacie-des-lilas.fr",freq:"hebdo",day:"lundi",hour:"07:00",sync:"02:00",ansm:"2",cover:14,cap:28,grossiste:"OCP Répartition",lab:"BIOGARAN",remise:40,vigil:10,mode:"lecture",epi:true};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem("hyg_settings")||"{}"))}catch(e){}
function saveS(){try{localStorage.setItem("hyg_settings",JSON.stringify(S))}catch(e){}}
// ---------- order state
const CAT=D.catalogue.map(c=>({id:c[0],name:c[1],form:c[2],holder:c[3],price:c[4],stock:c[5],demand:c[6],kind:c[0].startsWith("PARA")?"para":"med"}));
const CATI=Object.fromEntries(CAT.map(c=>[c.id,c]));
let mode=S.mode==="edition"?"edition":"lecture", sent=null, snap=null;
const L=[];   // lines
D.anticip.forEach(a=>L.push({...a,sec:"anticip",sug:a.qty,q:a.qty,sup:"grossiste",on:true}));
D.reassort.forEach(a=>L.push({...a,sec:"reassort",sug:a.qty,q:a.qty,sup:"grossiste",on:true}));
let showRe=false, view="tableau";
D.prev.forEach(p=>L.push({...p,sec:"prev",sug:p.qty,q:p.qty,sup:"grossiste",on:false,cap:p.cap||Math.ceil((p.demand||0)*28)}));
const openS=new Set(), openR=new Set();
function prefAlt(l){return (l.alts||[]).find(a=>a.holder.toUpperCase().includes(S.lab))}
function supLabel(l){if(l.sup==="grossiste")return S.grossiste;const a=(l.alts||[]).find(x=>x.id===l.sup);return a?`Direct labo — ${a.holder}`:S.grossiste}
function lineVal(l){return (l.price||0)*l.q}
// ---------- navigation
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){view=v;try{window.scrollTo(0,0)}catch(e){}document.querySelectorAll(".nav").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
 ["tableau","commande","rapports","parametres","methode"].forEach(k=>$("#v-"+k).classList.toggle("hide",k!==v));render()}
// ---------- COMMANDE
function cover(l){if(!l.demand||l.demand<=0||!l.q)return "";const d=l.q/l.demand;
  return `<div class="pf">${d<7?"≈ "+Math.max(1,Math.round(d))+" j":"≈ "+n1(d/7)+" sem."} de ventes</div>`}
function qtyCell(l,i){
  if(mode!=="edition")return `<span class="qty">${n0(l.q)}</span>${cover(l)}${l.q!==l.sug?`<div class="mod">modifié (suggéré ${n0(l.sug)})</div>`:""}`;
  const over=l.cap&&l.q>l.cap;
  return `<div class="step"><button data-dq="${i}" data-s="-1" aria-label="moins">−</button><input data-q="${i}" type="number" min="0" value="${l.q}"><button data-dq="${i}" data-s="1" aria-label="plus">+</button></div>${cover(l)}
  ${over?`<div class="warn">Au-delà du plafond anti-accaparement (${l.cap})</div>`:l.q!==l.sug?`<div class="mod">suggéré : ${n0(l.sug)}</div>`:""}`}
function supCell(l,i){
  if(mode!=="edition")return `<span class="small">${esc(supLabel(l))}</span>`;
  const p=prefAlt(l);
  const opts=[`<option value="grossiste" ${l.sup==="grossiste"?"selected":""}>${esc(S.grossiste)}</option>`].concat((l.alts||[]).map(a=>`<option value="${a.id}" ${l.sup===a.id?"selected":""}>${a===p?"★ ":""}Direct labo — ${esc(a.holder)}</option>`));
  return `<select class="sel" data-sup="${i}">${opts.join("")}</select>${p&&l.sup!==p.id?`<div class="small">★ votre labo préféré propose ce générique</div>`:""}`}
// ---------- COMMANDE : sections and lines that unfold
const SEC={
 anticip:{ic:"⚠️",t:"Pénuries déclarées par les labos",d:"Officiel (ANSM). Le grossiste peut encore livrer quelques jours : on commande maintenant.",tone:"red"},
 prev:{ic:"🔮",t:"Pénuries prévues par Hygisense",d:"Pas encore déclarées. Proposées, jamais ajoutées toutes seules : vous décidez.",tone:"blue"},
 reassort:{ic:"🔁",t:"Réassort habituel",d:"Produits sous votre seuil de 7 jours de ventes.",tone:"grey"},
 ajout:{ic:"➕",t:"Ajoutés par vous",d:"Médicaments ou parapharmacie ajoutés à la main.",tone:"grey"}};
function statusTag(l){
  if(l.sec==="anticip")return `<span class="tag ${l.status==="rupture"?"t-red":"t-amber"}">${l.status==="rupture"?"Rupture":"Tension"} déclarée</span>`;
  if(l.sec==="prev")return `<span class="tag t-blue">Prévue · ${n1(l.prob)} % à 8 sem.</span>`;
  if(l.sec==="reassort")return l.epi&&S.epi?`<span class="tag t-blue">+${l.epi} % épidémie</span>`:`<span class="tag t-grey">Réassort</span>`;
  return l.kind==="para"?`<span class="tag t-grey">Parapharmacie</span>`:`<span class="tag t-green">Ajout</span>`}
function box(t,body){return `<div class="dbox"><div class="dt">${t}</div>${body}</div>`}
function reasonChips(l){return (l.reasons||[]).map(r=>{const m=r.match(/^(.*) \(risque (×[\d,]+)\)$/);return `<span class="tag t-grey">${esc(m?m[1]:r)}${m?` <b>${m[2]}</b>`:""}</span>`}).join("")||`<span class="small">Aucun facteur de risque particulier</span>`}
function detail(l,i){
  const d=l.demand||0, cov=d>0?l.q/d:null;
  const pen = l.sec==="anticip"
    ? `<p><b>${l.status==="rupture"?"Rupture":"Tension"}</b> déclarée par le laboratoire à l'ANSM le <b>${esc(l.since)}</b>.</p><p>Votre grossiste doit encore livrer : ${l.left<=4?`<b style="color:var(--red)">plus que ~${l.left} jours</b>`:`encore ~${l.left} jours`}.</p>${l.link?`<p><a href="${esc(l.link)}" target="_blank" rel="noopener">Voir l'annonce ANSM ↗</a></p>`:""}`
    : l.sec==="prev"
    ? `<p><b>Pas encore déclarée.</b></p><p>Probabilité d'une déclaration dans les 8 semaines : <b>${n1(l.prob)} %</b>, soit <b>×${n1(l.index)}</b> le risque d'un médicament moyen.</p>`
    : l.sec==="reassort" ? `<p>Pas de pénurie connue.</p>${l.epi&&S.epi?`<p>Épidémie en hausse dans votre région : quantité <b>+${l.epi} %</b>.</p>`:""}`

  <div class="small">Sur ${s.declarations} pénuries déclarées sur vos produits en 2026, Hygisense en avait repéré <b style="color:var(--blue)">${s.caught}</b> au moins une semaine avant. Au hasard : ${n0(s.random_expected)}.</div>

function quant(a,q){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*s.length))]}

function bars(w){const W=560,H=250,P=34,max=Math.max(...w.map(x=>x.ca))*1.12;const bw=(W-P-10)/w.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Chiffre d'affaires par semaine">${[0,.5,1].map(f=>`<line x1="${P}" x2="${W}" y1="${H-20-(H-34)*f}" y2="${H-20-(H-34)*f}" stroke="currentColor" opacity=".08"/><text x="0" y="${H-17-(H-34)*f}">${n0(max*f/1000)}k</text>`).join("")}
  ${w.map((x,i)=>{const h=(H-34)*x.ca/max;return `<rect x="${P+i*bw+4}" y="${H-20-h}" width="${bw-8}" height="${h}" rx="3" fill="${i===w.length-1?"var(--accent)":"var(--accent-soft)"}" stroke="var(--accent)" stroke-opacity=".35"/>${i%2===w.length%2?`<text x="${P+i*bw+2}" y="${H-5}">${x.week}</text>`:""}`}).join("")}</svg>`}
